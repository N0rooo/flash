<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3226"/>
      <stop offset="1" stop-color="#221c14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.68">
      <stop offset="0" stop-color="#f7c948" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f7c948" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poil" cx="0.42" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#f9efdb"/>
      <stop offset="1" stop-color="#e7d2ab"/>
    </radialGradient>
    <linearGradient id="oreille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a36"/>
      <stop offset="1" stop-color="#7a6248"/>
    </linearGradient>
    <clipPath id="cadre">
      <rect x="20" y="20" width="984" height="984" rx="224"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="984" height="984" rx="224" fill="url(#nuit)"/>

  <g clip-path="url(#cadre)">
    <rect x="20" y="20" width="984" height="984" fill="url(#halo)"/>

    <!-- oreilles plus courtes et rondes, tips tombants : chiot plutôt que chien de garde -->
    <path d="M 292 480 C 246 370 254 250 316 168 C 330 158 350 158 366 176 C 428 240 466 310 486 390 C 420 408 344 442 292 480 Z" fill="url(#oreille)"/>
    <path d="M 732 480 C 778 370 770 250 708 168 C 694 158 674 158 658 176 C 596 240 558 310 538 390 C 604 408 680 442 732 480 Z" fill="url(#oreille)"/>
    <path d="M 328 424 C 302 340 310 262 346 200 C 398 254 432 314 450 378 C 406 392 362 406 328 424 Z" fill="#f7c948" opacity="0.9"/>

    <!-- tête ronde et grande -->
    <circle cx="512" cy="590" r="340" fill="url(#poil)"/>

    <!-- tache éclair adoucie sur l'œil gauche -->
    <path d="M 470 336 L 336 518 L 418 518 L 366 682 L 518 482 L 436 482 Z"
      fill="#f7c948" stroke="#f7c948" stroke-width="30" stroke-linejoin="round"/>

    <!-- museau -->
    <ellipse cx="512" cy="742" rx="205" ry="146" fill="#fdf7e8"/>

    <!-- joues roses -->
    <ellipse cx="292" cy="672" rx="58" ry="38" fill="#eba98c" opacity="0.55"/>
    <ellipse cx="732" cy="672" rx="58" ry="38" fill="#eba98c" opacity="0.55"/>

    <!-- petite truffe ronde -->
    <path d="M 512 700 C 486 695 466 680 466 660 C 466 638 486 626 512 626 C 538 626 558 638 558 660 C 558 680 538 695 512 700 Z" fill="#2b2620"/>
    <ellipse cx="496" cy="646" rx="12" ry="8" fill="#54463a"/>

    <!-- sourire tout doux et petite langue -->
    <path d="M 512 704 C 512 742 484 762 452 760" fill="none" stroke="#2b2620" stroke-width="18" stroke-linecap="round"/>
    <path d="M 512 704 C 512 742 540 762 572 760" fill="none" stroke="#2b2620" stroke-width="18" stroke-linecap="round"/>
    <path d="M 512 752 C 496 786 504 814 526 822 C 550 814 556 784 542 750 Z" fill="#e8756a"/>

    <!-- grands yeux tendres, double étincelle -->
    <circle cx="418" cy="505" r="44" fill="#2b2620"/>
    <circle cx="432" cy="490" r="15" fill="#fdf7e8"/>
    <circle cx="406" cy="522" r="7" fill="#fdf7e8" opacity="0.85"/>
    <circle cx="636" cy="505" r="44" fill="#2b2620"/>
    <circle cx="650" cy="490" r="15" fill="#fdf7e8"/>
    <circle cx="624" cy="522" r="7" fill="#fdf7e8" opacity="0.85"/>

    <!-- sourcils ronds au-dessus : l'air attendri -->
    <path d="M 384 424 Q 418 406 452 424" fill="none" stroke="#c9b491" stroke-width="16" stroke-linecap="round"/>
    <path d="M 602 424 Q 636 406 670 424" fill="none" stroke="#c9b491" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
