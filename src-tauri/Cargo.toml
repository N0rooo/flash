[package]
name = "flash"
version = "0.1.0"
description = "Flash, le chien qui rapporte tes photos dans l'ordre"
authors = ["Thomas Aubert"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
regex = "1"
sha1 = "0.10"
kamadak-exif = "0.6"
chrono = "0.4"
filetime = "0.2"

[profile.release]
strip = true
lto = true
